# fly.toml app configuration file generated for pielaiko-partiju on 2026-09-05T13:57:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pielaiko-partiju'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 150

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
