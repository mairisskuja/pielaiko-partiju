<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Franklin:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#FFFFFF;color:#111111;font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{box-sizing:border-box;width:1200px;height:630px;padding:56px 72px 48px;display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding-bottom:26px;border-bottom:2px solid #111111}
  h1{margin:36px 0 0;text-align:center;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:150px;font-weight:900;letter-spacing:-.02em;line-height:.95;color:#2E6B45}
  .tag{margin:26px 0 0;text-align:center;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:38px;color:#444444}
  .glyphs{display:flex;justify-content:center;gap:14px;margin-top:34px}
  .glyphs span{display:flex;align-items:center;justify-content:center;width:92px;height:64px;border:2px solid #D5D5D5;font-size:38px;font-weight:700;line-height:1}
  .pos{color:#2E6B45}.neu{color:#8A8A8A}.neg{color:#A6323E;text-decoration:line-through;text-decoration-thickness:4px}
  .foot{display:flex;justify-content:space-between;align-items:baseline;padding-top:18px;border-top:2px solid #E2E2E2;font-size:20px;font-weight:700;color:#333333}
  .foot .dims{color:#666666;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="kicker">15. Saeimas vēlēšanas · 2026. gada 3. oktobrī</div>
    <h1>Pielaiko partiju</h1>
    <p class="tag">24 apgalvojumi. 14 kandidātu saraksti. Tikai programmās rakstītais.</p>
    <div class="glyphs"><span class="pos">++</span><span class="pos">+</span><span class="neu">○</span><span class="neg">–</span><span class="neg">––</span></div>
  </div>
  <div class="foot">
    <span class="dims">Ekonomika · Drošība un ārpolitika · Vērtības un pārvaldība</span>
    <span>Neatkarīgs. Bez partiju reklāmas.</span>
  </div>
</div>
</body>
</html>
