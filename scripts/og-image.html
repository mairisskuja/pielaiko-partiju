<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;900&family=Libre+Franklin:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#FFFFFF;color:#111111;font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{box-sizing:border-box;width:1200px;height:630px;padding:44px 60px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .kicker{font-size:27px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111111}
  h1{margin:12px 0 0;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:170px;font-weight:900;letter-spacing:-.025em;line-height:.9;color:#2E6B45}
  .tag{margin:40px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:48px;line-height:1.22;color:#333333;max-width:900px;text-wrap:balance}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">15. Saeimas vēlēšanas · 2026. gada 3. oktobrī</div>
  <h1>Pielaiko<br>partiju</h1>
  <p class="tag">24 apgalvojumi. 14 kandidātu saraksti. Tikai programmās rakstītais.</p>
</div>
</body>
</html>
